<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c7"/>
      <stop offset="30%" stop-color="#f9d976"/>
      <stop offset="60%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8b6b12"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="6"
                    flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <text x="120" y="260"
        text-anchor="middle"
        font-family="Times New Roman, Georgia, serif"
        font-size="220"
        font-weight="bold"
        fill="url(#goldGradient)"
        filter="url(#softShadow)">
    K
  </text>
</svg>
