<svg width="1200" height="800" viewBox="0 0 1200 800"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->
    <rect x="0" y="0" width="1200" height="800" fill="#f3e4cf"/>

    <!-- Wooden stage platform -->
    <rect x="0" y="620" width="1200" height="80" fill="#5b3a22"/>
    <rect x="0" y="620" width="1200" height="80" fill="url(#woodGradient)" opacity="0.6"/>

    <!-- Top ornate bar background -->
    <rect x="0" y="0" width="1200" height="140" fill="#8b1c2f"/>

    <!-- Gold top ornament (simplified) -->
    <g transform="translate(0,0)">
        <rect x="0" y="0" width="1200" height="140" fill="none"/>
        <path d="M40 70
         C120 10, 260 10, 340 70
         C420 130, 540 130, 620 70
         C700 10, 840 10, 920 70
         C1000 130, 1120 130, 1180 70
         L1180 40
         C1100 90, 980 90, 900 40
         C820 -10, 700 -10, 620 40
         C540 90, 420 90, 340 40
         C260 -10, 140 -10, 60 40
         Z" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="3" />
    </g>

    <!-- Left curtain -->
    <g transform="translate(0,140)">
        <path d="M0 0
         C80 0, 140 40, 160 120
         C180 200, 160 280, 140 360
         C120 440, 100 520, 80 600
         L0 600 Z" fill="url(#curtainGradient)" />
        <!-- Tieback -->
        <ellipse cx="120" cy="320" rx="26" ry="18" fill="url(#goldGradient)"/>
        <path d="M120 338
         C118 360, 116 380, 114 400
         C112 420, 110 440, 108 460" stroke="#cfa64a" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Right curtain -->
    <g transform="translate(1200,140) scale(-1,1)">
        <path d="M0 0
         C80 0, 140 40, 160 120
         C180 200, 160 280, 140 360
         C120 440, 100 520, 80 600
         L0 600 Z" fill="url(#curtainGradient)" />
        <!-- Tieback -->
        <ellipse cx="120" cy="320" rx="26" ry="18" fill="url(#goldGradient)"/>
